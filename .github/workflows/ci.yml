name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Valori fictive: build-ul și testele nu contactează serviciile externe.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  NEXTAUTH_SECRET: ci-nextauth-secret-cel-putin-32-caractere
  NEXTAUTH_URL: http://localhost:3000
  CRON_SECRET: ci-cron-secret-0123456789
  RESEND_API_KEY: re_dummy
  EMAIL_FROM: noreply@example.ro
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: dummy
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verificari:
    name: Lint, tipuri, teste, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      # vitest.config.ts rulează fiecare test de două ori: cu TZ=UTC și cu
      # TZ=Europe/Bucharest (proiectele „UTC” și „Europe/Bucharest”).
      - name: Teste (UTC și Europe/Bucharest)
        run: npm test

      - name: Cache Next.js
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  migrari:
    name: Migrări Prisma și drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalare dependențe
        run: npm ci

      - name: Aplicare migrări pe o bază goală
        run: npx prisma migrate deploy

      # Baza migrată trebuie să fie identică cu schema.prisma; altfel lipsește o migrare.
      - name: Verificare drift între migrări și schema.prisma
        run: |
          set +e
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            --exit-code
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::error::schema.prisma nu corespunde migrărilor. Creează o migrare cu: npx prisma migrate dev --name <nume>"
            exit 1
          fi
          exit "$status"
